name: Core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Core safety and recovery contracts
        run: node --test --test-concurrency=2 tests/json.test.mjs tests/progress.test.mjs tests/security.test.mjs tests/cancellation.test.mjs tests/auto-resume.test.mjs tests/static-serving.test.mjs
